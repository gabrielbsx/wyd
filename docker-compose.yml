services:
  redis:
    image: redis:latest
    container_name: redis_game
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=redis_password
      - REDIS_PORT=6379
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  redis_data:
    driver: local